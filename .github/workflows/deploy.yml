name: Deploy VALORÉ Shop

on:
  push:
    branches: [main]

jobs:
  notify-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deployment URLs
        run: |
          echo "## VALORÉ Shop - Auto Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend & Backend Live" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://shop-app-te6c.vercel.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API**: https://shop-app-0fiy.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Both are now deploying from this commit..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Vercel** automatically deploys the `/client` folder" >> $GITHUB_STEP_SUMMARY
          echo "**Render** automatically deploys the `/server` folder" >> $GITHUB_STEP_SUMMARY

